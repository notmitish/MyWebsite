    const terminal = document.getElementById("terminal");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    let skip = false;
    let done = false;
    terminal.addEventListener("click", () => { skip = true; });

    function sleep(ms) {
      return new Promise((resolve) => {
        const id = setTimeout(resolve, ms);
        if (skip || reduceMotion) { clearTimeout(id); resolve(); }
      });
    }

    function buildLine({ prompt }) {
      const line = document.createElement("div");
      line.className = "line";
      if (prompt) {
        const promptSpan = document.createElement("span");
        promptSpan.className = "prompt";
        promptSpan.textContent = prompt;
        line.appendChild(promptSpan);
      }
      const span = document.createElement("span");
      span.className = "typed";
      line.appendChild(span);
      terminal.appendChild(line);
      return span;
    }

    async function typeLine(entry) {
      const span = buildLine(entry);

      if (entry.html) {
        span.innerHTML = entry.text;
        return;
      }

      if (skip || reduceMotion) {
        span.textContent = entry.text;
        return;
      }

      span.classList.add("blinking");
      for (const char of entry.text) {
        span.appendChild(document.createTextNode(char));
        terminal.scrollTop = terminal.scrollHeight;
        await sleep(20);
      }
      span.classList.remove("blinking");
    }

    async function startTyping() {
      for (const entry of lines) {
        if (done) return;
        await typeLine(entry);
      }
    }

    startTyping();
  </script>
